x-default-twist2-lab-volumes: &default-twist2-lab-volumes
  - type: volume
    source: isaac-cache-kit
    target: ${DOCKER_ISAACSIM_ROOT_PATH}/kit/cache
  - type: volume
    source: isaac-cache-ov
    target: ${DOCKER_USER_HOME}/.cache/ov
  - type: volume
    source: isaac-cache-pip
    target: ${DOCKER_USER_HOME}/.cache/pip
  - type: volume
    source: isaac-cache-gl
    target: ${DOCKER_USER_HOME}/.cache/nvidia/GLCache
  - type: volume
    source: isaac-cache-compute
    target: ${DOCKER_USER_HOME}/.nv/ComputeCache
  - type: volume
    source: isaac-logs
    target: ${DOCKER_USER_HOME}/.nvidia-omniverse/logs
  - type: volume
    source: isaac-carb-logs
    target: ${DOCKER_ISAACSIM_ROOT_PATH}/kit/logs/Kit/Isaac-Sim
  - type: volume
    source: isaac-data
    target: ${DOCKER_USER_HOME}/.local/share/ov/data
  - type: volume
    source: isaac-docs
    target: ${DOCKER_USER_HOME}/Documents
  - type: bind
    source: ../
    target: ${DOCKER_TWIST2_LAB_PATH}
  - type: bind
    source: ${HOST_GMR_ROOT}
    target: ${DOCKER_GMR_PATH}
    read_only: true
    bind:
      create_host_path: true

x-default-twist2-lab-environment: &default-twist2-lab-environment
  - ACCEPT_EULA=${ACCEPT_EULA}
  - PRIVACY_CONSENT=${PRIVACY_CONSENT}
  - OMNI_KIT_ALLOW_ROOT=1
  - PYTHONUNBUFFERED=1

x-default-twist2-lab-deploy: &default-twist2-lab-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [ gpu ]

services:
  twist2-lab:
    env_file: .env.base
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - ISAACLAB_BASE_IMAGE_ARG=${ISAACLAB_BASE_IMAGE}
        - DOCKER_TWIST2_LAB_PATH_ARG=${DOCKER_TWIST2_LAB_PATH}
    image: ${TWIST2_LAB_IMAGE}
    container_name: ${TWIST2_LAB_CONTAINER_NAME}
    working_dir: ${DOCKER_TWIST2_LAB_PATH}
    volumes: *default-twist2-lab-volumes
    network_mode: host
    ipc: host
    environment: *default-twist2-lab-environment
    deploy: *default-twist2-lab-deploy
    entrypoint: bash
    stdin_open: true
    tty: true

volumes:
  isaac-cache-kit:
  isaac-cache-ov:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-logs:
  isaac-carb-logs:
  isaac-data:
  isaac-docs:
